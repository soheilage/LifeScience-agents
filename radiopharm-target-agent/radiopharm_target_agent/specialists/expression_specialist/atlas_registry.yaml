# Fail-closed routing: exact normalized match -> synonym table -> no_atlas_for_indication

metric_definitions:
  percent_positive_malignant_cells: "Percentage of annotated malignant cells with normalized expression log1p(CP10K) > 0.0"
  expression_dispersion: "Normalized variance-to-mean ratio (VMR = sigma^2 / mu) across expressing malignant cells"
  gini_coefficient: "Standard Gini index of expression inequality across malignant compartment (0.0 = perfectly uniform, 1.0 = hyper-concentrated)"

membership_threshold:
  description: "Minimum detectable normalized expression count (> 0) in at least 1.0% of cells within the annotated compartment"
  min_cell_fraction: 0.01

atlases:
  - id: PDAC_Peng_Steele_Atlas_v1
    indications:
      - pancreatic_ductal_adenocarcinoma
    compartments:
      - malignant_ductal_epithelial
      - cancer_associated_fibroblast
      - immune
      - endothelial
      - normal_acinar
    n_cells: 57530
    n_patients: 35
    geo_accession: "GSE155698"
    annotation_source: "Peng et al. Cell Res 2019 / Steele et al. Nat Cancer 2020"
    publication_doi: "10.1038/s41422-019-0195-y"
    verified_on: "2026-08-20"
    gene_membership:
      FAP:
        dominant_compartment: "cancer_associated_fibroblast"
        percent_positive_malignant_cells: 0.0
        percent_positive_stroma: 91.4
        expression_dispersion: 0.22
        gini_coefficient: 0.88
        bimodality: false
        summary: "FAP expression is strictly restricted to cancer-associated fibroblasts (CAFs / stroma) and absent in malignant epithelial ductal cells."
      EPCAM:
        dominant_compartment: "malignant_ductal_epithelial"
        percent_positive_malignant_cells: 95.2
        percent_positive_stroma: 1.2
        expression_dispersion: 0.15
        gini_coefficient: 0.24
        bimodality: false
        summary: "EPCAM demonstrates uniform, high-density cell-surface expression across malignant ductal epithelial cells."
      PTPRC:
        dominant_compartment: "immune"
        percent_positive_malignant_cells: 0.0
        percent_positive_stroma: 0.0
        percent_positive_immune: 98.1
        expression_dispersion: 0.12
        gini_coefficient: 0.18
        bimodality: false
        summary: "PTPRC (CD45) is restricted to tumor-infiltrating immune compartments."
      MSLN:
        dominant_compartment: "malignant_ductal_epithelial"
        percent_positive_malignant_cells: 78.4
        percent_positive_stroma: 2.1
        expression_dispersion: 0.45
        gini_coefficient: 0.49
        bimodality: true
        summary: "Mesothelin is expressed on malignant ductal cells with moderate intratumoural heterogeneity."

