[tool.poetry]
name = "radiopharm-target-agent"
version = "0.1.0"
description = "A multi-agent system for radiopharmaceutical target assessment and prioritisation."
authors = ["Radiopharm Team <radiopharm@google.com>"]
readme = "README.md"
packages = [{include = "radiopharm_target_agent"}]

[tool.poetry.dependencies]
python = "^3.11"
google-adk = "^2.5.0"
google-genai = ">=1.0.0"
pydantic = "^2.10.6"
python-dotenv = "^1.0.1"
google-cloud-aiplatform = { version = ">=1.75.0", extras = ["agent-engines"] }
absl-py = "^2.1.0"
requests = "^2.32.0"
pypdf = "^4.0.0"
beautifulsoup4 = "^4.12.3"
biopython = "^1.83"
pubchempy = "^1.0.4"
tenacity = ">=9.0.0"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
pyyaml = "^6.0.0"
diskcache = "^5.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.poetry.group.deployment]
optional = true

[tool.poetry.group.deployment.dependencies]
absl-py = "^2.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
