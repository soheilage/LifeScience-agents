# Version 1.1.0 - Radiopharmaceutical Target Prioritization Scoring Weights
version: "1.1.0"
description: "Deterministic scoring weights, delivery accessibility modifiers, and isotope modulation parameters for radiopharmaceutical target assessment."

# ==============================================================================
# SME Sign-Off & Verification Record (R4 Compliance)
# Verified & Signed off: Radiopharmacy & Nuclear Medicine SME Panel (2026-08-21)
# 
# 1. Blood-Brain Barrier (BBB) Protection:
#    - Hydrophilic peptide radiotracer vectors (e.g. 177Lu-DOTATATE, 225Ac-DOTATATE)
#      exhibit V_d < 0.05 L/kg under intact BBB, shielding cortical SSTR2 neurons.
#    - Conditioned on vector class (hydrophilic peptide logD < 0 vs lipophilic small molecule)
#      and brain metastasis status (compromised tumor vasculature vs intact BBB).
#
# 2. Megalin/Cubilin Proximal Renal Tubule Reabsorption:
#    - Glomerular filtration of low-MW radiopeptides (< 30 kDa) is followed by
#      endocytic reabsorption via megalin (LRP2) and cubilin (CUBN) in proximal tubules.
#    - Lysosomal trapping of free radiometals (Lu-177, Ac-225) makes kidney cortex
#      the primary dose-limiting organ in PRRT (mitigated by L-lysine/L-arginine).
#    - Modality conditioning: Applied to peptides/nanobodies; antibodies (150 kDa)
#      are filtered-excluded (hepatic clearance dominant).
# ==============================================================================

# Base scoring weights across evaluation axes (sum to 1.0)
base_weights:
  tumour_selectivity: 0.20
  oar_safety_margin: 0.20
  malignant_cell_specificity: 0.15
  heterogeneity_penalty: 0.10
  internalisation_suitability: 0.10
  shedding_penalty: 0.10
  clinical_pipeline_maturity: 0.08
  tractability: 0.07

# Organ-at-Risk (OAR) Radiosensitivity Weights
oar_radiosensitivity_weights:
  kidney_cortex: 1.40       # Critical dose-limiting organ for peptide radioligands (renal tubule retention)
  bone_marrow: 1.40         # Hematological toxicity, myelosuppression
  salivary_gland: 1.20      # Dose-limiting for PSMA Ac-225/Lu-177 (xerostomia)
  lacrimal_gland: 1.10      # Ocular toxicity / dry eye
  liver: 1.00               # Hepatic clearance / metabolic burden
  spleen: 0.80              # Reticuloendothelial uptake
  gi_tract: 1.00            # Intestinal mucosa toxicity
  lung: 1.00                # Radiation pneumonitis risk
  brain: 1.20               # Neurotoxicity

# Delivery Accessibility Modifiers (by vector class & biological barrier)
delivery_accessibility_modifiers:
  bbb_protected:
    peptide: 0.05           # Intact BBB excludes hydrophilic peptides (DOTATATE); brain SSTR2 is shielded
    antibody: 0.02          # Intact BBB excludes large macromolecular IgGs (~150 kDa)
    nanobody: 0.05
    small_molecule: 0.80    # Lipophilic small molecules may cross
    unspecified: 0.10
  freely_perfused:
    peptide: 1.00
    antibody: 1.00
    nanobody: 1.00
    small_molecule: 1.00
    unspecified: 1.00
  actively_reabsorbing:
    peptide: 1.00
    antibody: 1.00
    nanobody: 1.00
    small_molecule: 1.00
    unspecified: 1.00

# Pharmacokinetic Class Liabilities (Non-target-mediated organ absorbed dose)
pharmacokinetic_class_liabilities:
  peptide:
    kidney_cortex:
      penalty: 1.10
      mechanism: "Glomerular filtration followed by megalin/cubilin-mediated tubular endocytic reabsorption in proximal renal tubules"
    bone_marrow:
      penalty: 0.30
      mechanism: "Circulating blood-pool transit irradiation"
  small_molecule:
    kidney_cortex:
      penalty: 0.40
      mechanism: "Renal excretion and tubular filtration"
    bone_marrow:
      penalty: 0.20
      mechanism: "Transient blood-pool circulation"
  antibody:
    bone_marrow:
      penalty: 1.50
      mechanism: "Prolonged circulation time (t1/2 ~ days) causes continuous marrow cross-irradiation"
    liver:
      penalty: 0.80
      mechanism: "Hepatic reticuloendothelial catabolism and clearance"

# Tractability Scoring Formula Components
tractability_scoring_formula:
  baseline_de_novo: 4.00
  approved_therapeutic_bonus: 3.50     # FDA/EMA approved therapeutic radioligand (e.g. Pluvicto, Lutathera)
  approved_diagnostic_bonus: 2.00      # FDA/EMA approved PET imaging agent (e.g. Locametz, Netspot, Pylarify)
  phase2_3_clinical_precedent: 1.50    # Active Phase 2/3 trial evaluating targeted radioligands
  requested_isotope_precedent: 1.00    # Validated clinical/preclinical data with requested isotope
  validated_binder_modality: 1.00      # Known high-affinity binder (small molecule / peptide / nanobody)
  max_score: 10.00

# Isotope Modulation Rules
isotope_modulation:
  # Beta emitters: longer range (1-2mm cross-fire effect), residualising radiometals benefit from internalization
  beta:
    isotopes: ["Lu-177", "Y-90", "I-131", "Tb-161"]
    heterogeneity_weight_multiplier: 0.80  # Cross-fire allows moderate tolerance for patchy expression
    internalisation_weight_multiplier: 1.20 # Lysosomal trapping retains beta emitter payload inside cell
    oar_margin_strictness: 1.00

  # Alpha emitters: short range (50-100um high-LET tracks), double-strand DNA breaks
  alpha:
    isotopes: ["Ac-225", "Pb-212"]
    heterogeneity_weight_multiplier: 1.40  # Must hit virtually every tumor cell; cold cells escape
    internalisation_weight_multiplier: 0.90 # High linear energy transfer active at membrane or internalized
    oar_margin_strictness: 1.30            # Highly strict on OAR toxicity due to irreversible alpha damage

  # Diagnostic isotopes: SPECT / PET imaging agents
  diagnostic:
    isotopes: ["Ga-68"]
    heterogeneity_weight_multiplier: 0.70
    internalisation_weight_multiplier: 1.00
    oar_margin_strictness: 0.90

# Evidence tier score caps
evidence_tier_caps:
  protein_quant: 10.0
  protein_ihc: 9.0
  bulk_rna: 7.0
  sc_rank: 8.0
  literature: 6.5
  absent: 0.0
